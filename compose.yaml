
services:
  postgres:
    image: postgres:17
    container_name: trainer-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: trainer_db
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - trainer_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d trainer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trainer_postgres_data:
