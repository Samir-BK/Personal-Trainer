spring.application.name=fitness-backend-test

# Keep tests independent of the local PostgreSQL server and DB_PASSWORD.
spring.datasource.url=jdbc:h2:mem:fitness-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Build the test schema with the same migrations used by the application.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
